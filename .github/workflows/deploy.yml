name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            startpage-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix startpage-api

      - name: Typecheck
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build project
        run: VITE_GIT_COMMIT=$(git rev-parse --short HEAD) npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: production-files
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: production-files
          path: dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/
          force_orphan: true
